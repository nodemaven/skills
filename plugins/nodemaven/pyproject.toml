# Pins the MCP server this plugin starts. uv.lock beside it holds the exact versions,
# sources and hashes of the server and everything it needs; the plugin runs it with
# `uv run --locked`, so an install gets those files and no others.
[project]
name = "nodemaven-plugin-mcp"
version = "0.1.4"
description = "The locked environment of the NodeMaven plugin's MCP server"
requires-python = ">=3.10"
dependencies = ["nodemaven-mcp==0.2.3"]

[tool.uv]
package = false
